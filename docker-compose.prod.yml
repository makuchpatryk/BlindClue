services:
  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: impostor-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/impostor.db
      CORS_ORIGIN: ${VITE_URL}
    volumes:
      - impostor_data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL}
    container_name: impostor-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ubuntu/certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost", "--insecure"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  impostor_data:
    driver: local
